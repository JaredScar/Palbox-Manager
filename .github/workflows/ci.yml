name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & type-check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build --workspace=ui

      - name: Build API
        run: npm run build --workspace=api

      - name: Type-check Electron
        run: npx tsc --noEmit
        working-directory: electron

      - name: Verify API entry point exists
        shell: pwsh
        run: |
          if (-not (Test-Path "api/dist/index.js")) {
            Write-Error "api/dist/index.js not found after build"
            exit 1
          }
          Write-Host "✓ api/dist/index.js present"

      - name: Verify UI dist exists
        shell: pwsh
        run: |
          if (-not (Test-Path "ui/dist/index.html")) {
            Write-Error "ui/dist/index.html not found after build"
            exit 1
          }
          Write-Host "✓ ui/dist/index.html present"
