name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── 1. Build UI + API once (platform-independent) ───────────────────────────
  prepare:
    name: Build UI & API
    runs-on: ubuntu-latest
    outputs:
      version:    ${{ steps.version.outputs.VER }}
      tag:        ${{ steps.version.outputs.TAG }}
      prerelease: ${{ steps.version.outputs.PRERELEASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Derive version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          [[ "$TAG" == *"-"* ]] && PRE=true || PRE=false
          echo "TAG=$TAG"     >> "$GITHUB_OUTPUT"
          echo "VER=$VER"     >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=$PRE" >> "$GITHUB_OUTPUT"

      - name: Build UI
        run: npm run build --workspace=ui

      - name: Build API
        run: npm run build --workspace=api

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: api/dist

  # ── 2a. Windows: NSIS .exe + MSI .msi ───────────────────────────────────────
  electron-windows:
    name: Electron — Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api/dist

      - name: Sync version into electron/package.json
        shell: pwsh
        run: |
          $pkg = Get-Content electron/package.json | ConvertFrom-Json
          $pkg.version = "${{ needs.prepare.outputs.version }}"
          $pkg | ConvertTo-Json -Depth 32 | Set-Content electron/package.json -Encoding UTF8

      - name: Compile Electron TypeScript
        run: npx tsc --project electron/tsconfig.json

      - name: Install API production deps (Windows binary)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path api-bundle | Out-Null
          Copy-Item api\package.json api-bundle\package.json
          Push-Location api-bundle
          npm install --omit=dev
          Pop-Location

      - name: Build Windows installers (NSIS + MSI)
        working-directory: electron
        shell: pwsh
        run: npx electron-builder --win --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: |
            electron/out/*.exe
            electron/out/*.msi

  # ── 2b. macOS: Universal DMG ─────────────────────────────────────────────────
  electron-mac:
    name: Electron — macOS
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api/dist

      - name: Sync version into electron/package.json
        run: |
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('electron/package.json','utf8'));
            p.version='${{ needs.prepare.outputs.version }}';
            fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2));
          "

      - name: Compile Electron TypeScript
        run: npx tsc --project electron/tsconfig.json

      - name: Install API production deps (macOS binary)
        run: |
          mkdir -p api-bundle
          cp api/package.json api-bundle/
          cd api-bundle && npm install --omit=dev

      - name: Build macOS installer (universal DMG)
        working-directory: electron
        run: npx electron-builder --mac --universal --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: electron-mac
          path: electron/out/*.dmg

  # ── 2c. Linux: AppImage + deb ─────────────────────────────────────────────────
  electron-linux:
    name: Electron — Linux
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Linux packaging tools
        run: sudo apt-get install -y rpm fakeroot

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api/dist

      - name: Sync version into electron/package.json
        run: |
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('electron/package.json','utf8'));
            p.version='${{ needs.prepare.outputs.version }}';
            fs.writeFileSync('electron/package.json',JSON.stringify(p,null,2));
          "

      - name: Compile Electron TypeScript
        run: npx tsc --project electron/tsconfig.json

      - name: Install API production deps (Linux binary)
        run: |
          mkdir -p api-bundle
          cp api/package.json api-bundle/
          cd api-bundle && npm install --omit=dev

      - name: Build Linux installers (AppImage + deb)
        working-directory: electron
        run: npx electron-builder --linux --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: electron-linux
          path: |
            electron/out/*.AppImage
            electron/out/*.deb

  # ── 3. Server ZIP (Windows headless package) ─────────────────────────────────
  server-zip:
    name: Server package (ZIP)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api/dist

      - name: Stage and zip server package
        shell: pwsh
        run: |
          $ver  = "${{ needs.prepare.outputs.version }}"
          $dest = "staging\palbox-server-$ver"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force api\dist "$dest\api-dist"

          # Install API prod deps — workspace hoisting means api/node_modules doesn't exist
          Copy-Item -Force api\package.json "$dest\package.json"
          Push-Location $dest
          npm install --omit=dev
          npm rebuild better-sqlite3
          Pop-Location
          Remove-Item "$dest\package.json" -Force

          Copy-Item -Recurse -Force ui\dist "$dest\ui-dist"
          Copy-Item -Force .env.example "$dest\.env.example"
          Copy-Item -Force scripts\Install-Palbox.ps1   "$dest\Install-Palbox.ps1"
          Copy-Item -Force scripts\Uninstall-Palbox.ps1 "$dest\Uninstall-Palbox.ps1"

          $readme  = "# Palbox Server Package v$ver`r`n`r`n"
          $readme += "## Quick setup`r`n"
          $readme += "1. Extract this ZIP to a temporary folder.`r`n"
          $readme += "2. Open PowerShell as Administrator in that folder.`r`n"
          $readme += "3. Run: .\Install-Palbox.ps1`r`n`r`n"
          $readme += "The script checks prerequisites (installs Node.js 22 LTS if needed),`r`n"
          $readme += "prompts for your server paths, writes .env, and registers a`r`n"
          $readme += "Windows service via NSSM.`r`n`r`n"
          $readme += "## Requirements`r`n"
          $readme += "- Windows 10 / Server 2019 or newer`r`n"
          $readme += "- Node.js 22+   https://nodejs.org  (auto-installed by the script)`r`n"
          $readme += "- NSSM          https://nssm.cc/download`r`n`r`n"
          $readme += "## Manual start (without NSSM)`r`n"
          $readme += "  cd api-dist && node index.js`r`n`r`n"
          $readme += "## Uninstall`r`n"
          $readme += "  .\Uninstall-Palbox.ps1 -RemoveFiles`r`n"
          $readme | Set-Content "$dest\README-server.txt" -Encoding UTF8

          $zip = "palbox-server-$ver.zip"
          Compress-Archive -Path "$dest\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip ($('{0:N1}' -f ((Get-Item $zip).Length / 1MB)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: server-zip
          path: palbox-server-*.zip

  # ── 4. Create GitHub Release with all artifacts ──────────────────────────────
  release:
    name: Publish Release
    needs: [prepare, electron-windows, electron-mac, electron-linux, server-zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          pattern: '{electron-windows,electron-mac,electron-linux,server-zip}'

      - name: List release assets
        run: ls -lh release-assets/

      - name: Generate release notes
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          {
            echo "## Palbox $TAG"
            echo ""
            echo "Self-hosted Palworld server management panel."
            echo ""
            echo "### Downloads"
            echo ""
            echo "| File | Platform | Description |"
            echo "|------|----------|-------------|"
            echo "| \`Palbox-Setup-$VER-windows.exe\` | Windows | NSIS installer — guided setup with Node.js auto-install |"
            echo "| \`Palbox-Setup-$VER-windows.msi\` | Windows | MSI installer — for enterprise / Group Policy deployments |"
            echo "| \`Palbox-$VER-mac.dmg\` | macOS (Universal) | DMG — works on both Intel and Apple Silicon |"
            echo "| \`Palbox-$VER-linux-x64.AppImage\` | Linux | Portable AppImage — no install needed |"
            echo "| \`Palbox-$VER-linux-x64.deb\` | Linux | Debian/Ubuntu package |"
            echo "| \`palbox-server-$VER.zip\` | Windows Server | Headless server package + PowerShell setup wizard |"
            echo ""
            echo "### Requirements"
            echo "- **Desktop installers:** Node.js 22+ (auto-installed on Windows if missing)"
            echo "- **Server ZIP:** Windows 10 / Server 2019+, Node.js 22+ (auto-installed), [NSSM](https://nssm.cc/download)"
            echo ""
            echo "### Server ZIP — quick setup"
            echo '```powershell'
            echo "# Extract palbox-server-$VER.zip, then:"
            echo ".\Install-Palbox.ps1   # run as Administrator"
            echo '```'
            echo ""
            echo "### Upgrading"
            echo '```powershell'
            echo "nssm stop PalboxAPI"
            echo "# Overwrite api-dist/ and node_modules/ — keep your .env"
            echo "nssm start PalboxAPI"
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          PRE="${{ needs.prepare.outputs.prerelease }}"

          ARGS=(release create "$TAG" --title "Palbox $TAG" --notes-file release-notes.md)
          [[ "$PRE" == "true" ]] && ARGS+=(--prerelease)

          for f in release-assets/*; do
            [[ -f "$f" ]] && ARGS+=("$f")
          done

          gh "${ARGS[@]}"
          echo "✓ Release $TAG published."
