name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-releases: v1.2.3-beta.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Toolchain ─────────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Build UI + API ────────────────────────────────────────────────────────
      - name: Build UI
        run: npm run build --workspace=ui

      - name: Build API
        run: npm run build --workspace=api

      # ── Derive version from tag ───────────────────────────────────────────────
      - name: Set version variable
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Strip leading 'v' for artifact filenames
          $ver = $tag.TrimStart('v')
          echo "TAG=$tag"   >> $env:GITHUB_OUTPUT
          echo "VER=$ver"   >> $env:GITHUB_OUTPUT
          Write-Host "Tag: $tag   Version: $ver"

      # ── Electron NSIS installer ───────────────────────────────────────────────
      # electron-builder reads the version from electron/package.json; we sync it
      # from the git tag so the .exe filename matches the release.
      - name: Sync version into electron/package.json
        shell: pwsh
        run: |
          $pkgPath = "electron/package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = "${{ steps.version.outputs.VER }}"
          $pkg | ConvertTo-Json -Depth 32 | Set-Content $pkgPath -Encoding UTF8
          Write-Host "electron/package.json version → $($pkg.version)"

      - name: Compile Electron TypeScript
        run: npx tsc --project electron/tsconfig.json

      - name: Build Electron desktop installer (NSIS)
        shell: pwsh
        working-directory: electron
        run: npx electron-builder --win --x64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Electron installer
        id: electron-artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "electron/out" -Filter "*.exe" -Recurse |
                 Where-Object { $_.Name -match "Setup" } |
                 Select-Object -First 1
          if (-not $exe) { Write-Error "No NSIS .exe found in electron/out/"; exit 1 }
          echo "PATH=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Electron installer: $($exe.FullName)"

      # ── Server ZIP package ────────────────────────────────────────────────────
      - name: Stage server package
        shell: pwsh
        run: |
          $ver  = "${{ steps.version.outputs.VER }}"
          $dest = "staging\palbox-server-$ver"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # API compiled output
          Copy-Item -Recurse -Force api\dist      "$dest\api-dist"
          Copy-Item -Recurse -Force api\node_modules "$dest\node_modules"

          # UI static files (the API will serve these)
          Copy-Item -Recurse -Force ui\dist       "$dest\ui-dist"

          # Config template & installer scripts
          Copy-Item -Force .env.example           "$dest\.env.example"
          Copy-Item -Force scripts\Install-Palbox.ps1   "$dest\Install-Palbox.ps1"
          Copy-Item -Force scripts\Uninstall-Palbox.ps1 "$dest\Uninstall-Palbox.ps1"

          # Write a quick README for the ZIP (avoid here-strings; unindented content breaks YAML block scalars)
          $readme  = "# Palbox Server Package v$ver`r`n`r`n"
          $readme += "## Quick setup`r`n"
          $readme += "1. Extract this ZIP to a temporary folder.`r`n"
          $readme += "2. Open PowerShell as Administrator in that folder.`r`n"
          $readme += "3. Run: .\Install-Palbox.ps1`r`n`r`n"
          $readme += "The script checks prerequisites (and installs Node.js 22 LTS`r`n"
          $readme += "automatically if needed), prompts for your paths, writes .env,`r`n"
          $readme += "and registers a Windows service via NSSM.`r`n`r`n"
          $readme += "## Requirements`r`n"
          $readme += "- Windows 10 / Server 2019 or newer`r`n"
          $readme += "- Node.js 22+   https://nodejs.org  (installer can auto-install this)`r`n"
          $readme += "- NSSM          https://nssm.cc/download`r`n`r`n"
          $readme += "## Manual start (without NSSM)`r`n"
          $readme += "  cd api-dist`r`n"
          $readme += "  node index.js`r`n`r`n"
          $readme += "## Uninstall`r`n"
          $readme += "  .\Uninstall-Palbox.ps1 -RemoveFiles`r`n"
          $readme | Set-Content "$dest\README-server.txt" -Encoding UTF8

          Write-Host "Staged to $dest"
          echo "STAGE=$dest" >> $env:GITHUB_OUTPUT

      - name: Create server ZIP
        id: server-zip
        shell: pwsh
        run: |
          $ver     = "${{ steps.version.outputs.VER }}"
          $stage   = "staging\palbox-server-$ver"
          $zipName = "palbox-server-$ver.zip"

          Compress-Archive -Path "$stage\*" -DestinationPath $zipName -CompressionLevel Optimal
          Write-Host "Created $zipName ($('{0:N2}' -f ((Get-Item $zipName).Length / 1MB)) MB)"
          echo "PATH=$zipName" >> $env:GITHUB_OUTPUT

      # ── Generate release notes ─────────────────────────────────────────────────
      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VER }}"
          $tag = "${{ steps.version.outputs.TAG }}"
          $isPrerelease = $tag -match '-'

          # Build release notes without here-strings to keep YAML valid
          $n  = "## Palbox $tag`n`n"
          $n += "Self-hosted Palworld server management panel.`n`n"
          $n += "### Downloads`n`n"
          $n += "| File | Description |`n"
          $n += "|------|-------------|`n"
          $n += "| ``Palbox-Setup-$ver.exe`` | **Desktop installer** (Windows x64). Bundles the full panel; launches the API automatically. Node.js 22 LTS is installed automatically if missing. |`n"
          $n += "| ``palbox-server-$ver.zip`` | **Headless server package**. Extract and run ``Install-Palbox.ps1`` as Administrator. Node.js 22 LTS is installed automatically if missing. |`n`n"
          $n += "### Requirements`n"
          $n += "- Windows 10 / Server 2019 or newer (x64)`n"
          $n += "- [Node.js 22+](https://nodejs.org) — installed automatically by both installers`n"
          $n += "- [NSSM](https://nssm.cc/download) *(server ZIP only — for Windows service registration)*`n`n"
          $n += "### First-time setup (server ZIP)`n"
          $n += '```powershell' + "`n"
          $n += "# 1. Extract palbox-server-$ver.zip`n"
          $n += "# 2. Open PowerShell as Administrator`n"
          $n += '.\Install-Palbox.ps1' + "`n"
          $n += "# Follow the prompts — Node.js is auto-installed, .env is written, service is registered.`n"
          $n += '```' + "`n`n"
          $n += "### Upgrading from a previous version`n"
          $n += '```powershell' + "`n"
          $n += "nssm stop PalboxAPI`n"
          $n += "# Overwrite api-dist/ and node_modules/ with the new package contents,`n"
          $n += "# keeping your existing .env file.`n"
          $n += "nssm start PalboxAPI`n"
          $n += '```' + "`n"
          $n | Set-Content release-notes.md -Encoding UTF8
          echo "PRERELEASE=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      # ── Create GitHub Release ──────────────────────────────────────────────────
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag  = "${{ steps.version.outputs.TAG }}"
          $zip  = "${{ steps.server-zip.outputs.PATH }}"
          $exe  = "${{ steps.electron-artifact.outputs.PATH }}"
          $pre  = "${{ steps.notes.outputs.PRERELEASE }}"

          $preFlag = if ($pre -eq 'true') { '--prerelease' } else { '' }

          gh release create $tag `
            --title "Palbox $tag" `
            --notes-file release-notes.md `
            $preFlag `
            $zip `
            $exe

          Write-Host "✓ Release $tag created."
